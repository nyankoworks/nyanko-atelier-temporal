name: サイトを公開する

# main ブランチに push（GitHub Desktop の「同期」）するたびに自動で実行されます。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: サイトをビルド（works/ を読み取って _site/ を生成）
        run: python3 build.py

      - name: 生成物をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages に公開
        id: deployment
        uses: actions/deploy-pages@v4
