<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#e9a0a0;--ink:#4a423b;--soft:#8a7f74;--bg:#faf5ec;--card:#fffdf9;--line:#ece2d2;--rakuten:#bf0000;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Zen Maru Gothic",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.8;}
  .wrap{max-width:960px;margin:0 auto;padding:36px 24px 90px;}

  .lead{color:var(--soft);margin:0 0 24px;}

  .art{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px;text-decoration:none;color:var(--ink);box-shadow:0 3px 12px rgba(120,100,80,.06);transition:transform .12s;}
  .art:hover{transform:translateY(-2px);}
  .num{width:34px;height:34px;border-radius:50%;background:var(--rakuten);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .art b{font-size:15px;}
  .art .u{font-size:12px;color:var(--soft);}
</style>
</head>
